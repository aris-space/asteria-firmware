[package]
name = "fw-lox-valve-control-board"
version = "0.1.0"
edition = "2024"
authors = ["Louis Schell <louis.schell1@gmx.de>"]

[dependencies]
embedded-utils = { path = "../../crates/embedded-utils" }
epos4 = { path = "../../crates/devices/epos4" }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embassy-stm32 = { version = "*", features = [
    "stm32g4a1ke",
    "time-driver-any",
    "memory-x",
    "exti",
    "unstable-pac",
] }
embassy-time = { version = "*", features = ["tick-hz-32_768"] }
embassy-executor = { version = "*", features = ["arch-cortex-m", "executor-thread"] }
embassy-futures = "*"
embassy-sync = "*"
defmt = { version = "1.0.1", optional = true }
defmt-rtt = { version = "1.0.0", optional = true }
panic-probe = { version = "1.0.0", optional = true }
panic-reset = "0.1.1"
embedded-io-async = "0.7"
rmodbus = { version = "^0.10.2", default-features = false, features = ["defmt", "heapless"] }
heapless = "0.8.0"
static_cell = "2.1.0"
bitflags = "1.3.2"

[build-dependencies]
built = { version = "0.7.7", features = ["git2"] }

[features]
default = ["debug"]
debug = ["defmt", "dep:panic-probe"]
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "panic-probe/defmt",
    "panic-probe/defmt-error",
    "panic-probe/print-defmt",
    "embassy-executor/defmt",
    "embassy-sync/defmt",
    "embassy-futures/defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime",
    "embassy-stm32/defmt",
    "epos4/defmt",
]

[[bin]]
name = "fw-lox-valve-control-board"
test = false
doctest = false
bench = false
