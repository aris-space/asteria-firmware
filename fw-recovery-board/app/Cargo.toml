[package]
name = "fw-recovery-board"
version = "0.1.0"
edition = "2024"

[dependencies]
embedded-utils = { path = "../../crates/embedded-utils" }
hermes-can = { path = "../../hermes-can", version = "=0.3", features = [
    "defmt",
    "message-separation-trigger",
    "message-deployment-trigger",
    "message-separation-occurred",
    "message-deployment-occurred",
    "message-steering-target-positions",
    "message-steering-actual-positions",
    "message-recovery-power-config",
    "message-recovery-board-status",
    "message-recovery-board-build-info",
] }
thiserror = { version = "2.0.11", default-features = false }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embassy-stm32 = { version = "*", features = ["stm32g473rc", "time-driver-any", "memory-x"] }
embassy-time = { version = "*", features = ["tick-hz-32_768"] }
embassy-executor = { version = "*", features = ["arch-cortex-m", "executor-thread"] }
embassy-futures = "*"
embassy-sync = "*"
embedded-can = "0.4.1"
embedded-hal-async = "1.0.0"
embedded-hal-bus = "0.3.0"
defmt = { version = "1.0.1", optional = true }
defmt-rtt = { version = "1.0.0", optional = true }
panic-probe = { version = "1.0.0", optional = true }
panic-reset = "0.1.1"

[build-dependencies]
built = { version = "0.7.7", features = ["git2"] }

[features]
default = ["debug"]
debug = ["defmt", "dep:panic-probe"]
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "panic-probe/defmt",
    "panic-probe/defmt-error",
    "panic-probe/print-defmt",
    "embassy-executor/defmt",
    "embassy-sync/defmt",
    "embassy-futures/defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime",
    "embassy-stm32/defmt",
    "embedded-hal-async/defmt-03",
    "embedded-hal-bus/defmt-03",
]

[[bin]]
name = "fw-recovery-board"
test = false
doctest = false
bench = false
