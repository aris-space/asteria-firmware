[workspace]
resolver = "2"
members = ["app", "validation"]

[patch.crates-io]
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy.git", rev = "cf6a6cd" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "cf6a6cd" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "cf6a6cd" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", rev = "cf6a6cd" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "cf6a6cd" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy.git", rev = "cf6a6cd" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy.git", rev = "cf6a6cd" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy.git", rev = "cf6a6cd" }
embassy-usb-logger = { git = "https://github.com/embassy-rs/embassy.git", rev = "cf6a6cd" }
# block-device-driver defines the BlockDevice trait. embassy-stm32 impls it on its SDMMC
# StorageDevice via a crates.io dep on block-device-driver, while the git embedded-fatfs
# stack (block-device-adapters' BufStream) uses the copy from its own repo. Two sources
# would be two distinct BlockDevice traits, so redirect the crates.io copy to the git one.
block-device-driver = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc" }
#postcard-rpc = { git = "https://github.com/aris-space/postcard-rpc.git", rev = "af9991e" }

[profile.dev]
debug = 2
debug-assertions = true
incremental = true
opt-level = 1
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false
