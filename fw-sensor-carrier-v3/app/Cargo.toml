[package]
name = "fw-sensor-carrier-v3"
version = "0.1.0"
edition = "2024"
authors = ["Louis Schell <louis.schell1@gmx.de>"]
license = "MIT OR Apache-2.0"

[features]
default = ["debug"]
debug = ["dep:panic-probe"]

[dependencies]
asteria-sef-light = { path = "../../asteria-state-estimation/crates/sef-light" }
asteria-sef-core = { path = "../../asteria-state-estimation/crates/sef-core" }
libm = "0.2.11"

[target.'cfg(target_os = "none")'.dependencies]
# Shared crates from the repo
embedded-utils = { path = "../../crates/embedded-utils", features = ["defmt"] }
ms5607 = { path = "../../crates/devices/ms5607", features = ["defmt-03"] }
lsm6dso32 = { path = "../../crates/devices/lsm6dso32", features = ["defmt-03"] }
can-utils = { path = "../../crates/can-utils", features = ["defmt"] }
data-core = { path = "../../data-definitions/core", version = "0.1.0", features = ["can"] }
dp-sensor-carrier = { path = "../../data-definitions/datapoints/dp-sensor-carrier", version = "=0.3", features = [
    "can",
    "derive_defmt",
] }
dp-system-management = { path = "../../data-definitions/datapoints/dp-system-management", version = "=0.3", features = [
    "can",
    "derive_defmt",
] }
datatypes = { path = "../../data-definitions/datatypes", features = ["derive_defmt"] }

# Param storage
sequential-storage = { version = "7.2.0", features = ["postcard"] }
embedded-storage-async = "0.4.1"
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
postcard = { version = "1.1.3", features = ["experimental-derive"] }
postcard-schema = { version = "0.2.5", features = ["derive"] }

# cortex-m setup
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"

# Embassy
embassy-stm32 = { version = "*", features = [
    "stm32h723zg",
    "single-bank",
    "time-driver-any",
    "memory-x",
    "unstable-pac",
    "exti",
    "defmt",
] }
embassy-time = { version = "*", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-executor = { version = "*", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-futures = { version = "*", features = ["defmt"] }
embassy-sync = { version = "*", features = ["defmt"] }
embassy-embedded-hal = "*"
embassy-usb = { version = "*", features = ["defmt"] }

assign-resources = "0.5.0"
static_cell = "2.1.1"

# Drivers
lsm303agr = { version = "1.1.0", features = ["async"] }
sht4x = { version = "0.2.0", features = ["embedded-hal-async", "defmt"] }
ublox = { version = "0.4.5", default-features = false }


embedded-can = "0.4.1"
embedded-hal = "1.0.0"
embedded-hal-async = { version = "1.0.0", features = ["defmt-03"] }
embedded-hal-bus = { version = "0.3.0", features = ["async", "defmt-03"] }
embedded-io-async = { version = "0.7.0", default-features = false, features = ["defmt"] }
# noline 0.5.1 is pinned to embedded-io-async 0.6; alias that version so the
# console IO adapter can impl the traits noline expects, leaving embassy on 0.7.
embedded-io-async-06 = { package = "embedded-io-async", version = "0.6.1", default-features = false }

defmt = "1.0.1"
# Drop log lines when the RTT buffer is full instead of stalling the board
# until the probe drains it; probe-rs otherwise switches RTT to blocking.
defmt-rtt = { version = "1.0.0", features = ["disable-blocking-mode"] }

# Math
nalgebra = { version = "0.33", default-features = false, features = ["libm"] }

atomic_enum = { version = "0.3.0", default-features = false }

panic-probe = { version = "1.0.0", features = [
    "defmt",
    "defmt-error",
    "print-defmt",
], optional = true }
panic-reset = "0.1.1"
heapless = "0.9.2"
noline = "0.5.1"
embedded-fatfs = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc", version = "0.1.0", default-features = false }
block-device-adapters = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc", version = "0.2.0" }
embedded-partitions = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc", version = "0.1.0" }

[build-dependencies]
built = { version = "0.8", features = ["git2"] }

[[bin]]
name = "fw-sensor-carrier-v3"
test = false
doctest = false
bench = false
