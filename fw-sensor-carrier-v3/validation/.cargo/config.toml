# Inherits rustflags, target, and DEFMT_LOG from ../.cargo/config.toml.
# Adds a runner so `cargo run` flashes and streams defmt over RTT via probe-rs.
[target.thumbv7em-none-eabihf]
runner = [
    "probe-rs",
    "run",
    "--chip",
    "STM32H723ZG",
    #"--no-catch-hardfault",
    #"--no-catch-reset",
    #"--chip-erase",
    "--log-format",
    "{t} {L:severity} {s}",
]

# App logs at info. Overrides the inherited DEFMT_LOG=trace so embassy's internal
# SPI/I2C/DMA trace doesn't flood the output.
[env]
DEFMT_LOG = "info"
