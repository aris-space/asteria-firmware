[project]
name = "fw-sensor-carrier-v3-analysis"
version = "0.1.0"
description = "Calibration and estimator replay from fw-sensor-carrier-v3 SD logs"
requires-python = ">=3.12"
dependencies = ["matplotlib", "numpy", "pandas", "scipy", "sef-light"]

[tool.uv]
package = false

[tool.uv.sources]
# The bindings live with SEF-light in the asteria-state-estimation repo. The
# firmware's copy of SEF-light comes from its state-estimation-trait branch,
# which is checked out in this worktree until it is merged.
sef-light = { path = "../../../../../.codex/worktrees/state-estimation-trait-prototype/asteria-state-estimation/crates/sef-light-py" }

[tool.ruff]
line-length = 120
