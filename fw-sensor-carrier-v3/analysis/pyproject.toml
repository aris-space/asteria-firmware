[project]
name = "fw-sensor-carrier-v3-analysis"
version = "0.1.0"
description = "Calibration and estimator replay from fw-sensor-carrier-v3 SD logs"
requires-python = ">=3.12"
dependencies = ["matplotlib", "numpy", "pandas", "scipy", "sef-light"]

[tool.uv]
package = false

[tool.uv.sources]
# The bindings sit next to SEF-light in the asteria-state-estimation
# submodule, untracked there and not published.
sef-light = { path = "../../asteria-state-estimation/sef-light-py" }

[tool.ruff]
line-length = 120
