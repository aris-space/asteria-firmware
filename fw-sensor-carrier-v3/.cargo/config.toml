[target.thumbv7em-none-eabihf]
rustflags = [
    "-C",
    "linker=flip-link",
    "-C",
    "link-arg=-Tlink.x",
    "-C",
    "link-arg=--nmagic",
    # STM32H723ZG is a Cortex-M7F with FPv5-D16 (double-precision FPU).
    # Selecting the CPU enables hardware f64 codegen instead of soft-float calls.
    "-C",
    "target-cpu=cortex-m7",
]

[build]
target = "thumbv7em-none-eabihf" # Cortex-M7F (with single and double-precision FPU)

[env]
# CAN logs are silenced because most bench testing runs without a bus, where
# every TX times out and the idle bus emits Bus(Stuff) RX errors at high rate.
# Drop the `,fw_sensor_carrier_v3::tasks::can=off` suffix to re-enable them.
DEFMT_LOG = "info,fw_sensor_carrier_v3::tasks::can=off"
