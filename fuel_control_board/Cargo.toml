[package]
name = "fuel_control_board"
version = "0.1.0"
edition = "2021"
authors = ["Domenic Nebiker <dnebiker@aris-space.ch>"]

[dependencies]
keller_pressure = { path = "../devices/keller_pressure" }

embedded_utils = { path = "../embedded_utils" }

cortex-m = { workspace = true, features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = { workspace = true }

embassy-stm32 = { workspace = true, features = [
    "stm32g473rc",
    "time-driver-any",
    "memory-x",
    "unstable-pac",
    "exti",
] }
embassy-time = { workspace = true, features = ["tick-hz-32_768"] }
embassy-executor = { workspace = true, features = ["arch-cortex-m", "executor-thread"] }
embassy-futures = { workspace = true }
embassy-sync = { workspace = true }

embedded-can = { workspace = true }
embedded-hal-async = { workspace = true }
embedded-hal-bus = { workspace = true, features = ["async"] }

defmt = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }

panic-probe = { workspace = true, optional = true }
panic-reset = { workspace = true }

hermes-can = { workspace = true, features = [
    "defmt",
    "message-pressurization-line-pressure",
    "message-fuel-tank-pressure",
    "message-fuel-control-board-build-info",
    "message-fuel-control-board-status",
    "message-fuel-control-board-valve-states",
    "message-fuel-vent-control-fc",
    "message-fuel-dpr-config-fc",
    "message-pressure-vent-control-fc",
    "message-fuel-dpr-config-ecu",
    "message-fuel-vent-control-ecu",
    "message-pressure-vent-control-ecu",
    "message-fuel-dpr-config-rfs",
    "message-fuel-vent-control-rfs",
    "message-pressure-vent-control-rfs",
    "message-fuel-pressurization",
    "message-fuel-pressurization-abort",
    "message-fuel-pressurization-gain",

] }

thiserror = { version = "2.0.11", default-features = false }

[build-dependencies]
built = { version = "0.7.7", features = ["git2"] }

[features]
default = ["debug"]
debug = ["defmt", "dep:panic-probe"]
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "panic-probe/defmt",
    "panic-probe/defmt-error",
    "panic-probe/print-defmt",
    "embassy-executor/defmt",
    "embassy-sync/defmt",
    "embassy-futures/defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime",
    "embassy-stm32/defmt",
    "embedded-hal-async/defmt-03",
    "embedded-hal-bus/defmt-03",
    "keller_pressure/defmt",
]

[[bin]]
name = "fuel_control_board"
test = false
doctest = false
bench = false
