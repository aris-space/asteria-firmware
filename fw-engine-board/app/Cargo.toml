[package]
name = "fw-engine-board"
version = "0.2.0"
edition = "2024"
authors = ["Domenic Nebiker <dnebiker@aris-space.ch>", "Ben Lies <ben.lies@aris-space.ch>"]
license = "MIT OR Apache-2.0"

[dependencies]
ads1120-thermocouples = { path = "../../crates/devices/ads1120-thermocouples" }
max31889-thermistor = { path = "../../crates/devices/max31889-thermistor" }
analog-pressure = { path = "../../crates/devices/analog-pressure" }
filters = { path = "../../crates/filters" }
embedded-utils = { path = "../../crates/embedded-utils" }
can-utils = { path = "../../crates/can-utils" }
data-core = { path = "../../data-definitions/core", version = "0.1.0", features = ["can"] }
dp-engine-control-board = { path = "../../data-definitions/datapoints/dp-engine-control-board", version = "=0.5", features = [
    "can",
] }
dp-system-management = { path = "../../data-definitions/datapoints/dp-system-management", version = "=0.3", features = [
    "can",
] }
datatypes = { path = "../../data-definitions/datatypes" }
thermocouple = "0.1.3"
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embassy-stm32 = { version = "*", features = [
    "stm32g473rc",
    "time-driver-any",
    "memory-x",
    "unstable-pac",
    "exti",
    "single-bank",
] }
embassy-time = { version = "*", features = ["tick-hz-32_768"] }
embassy-executor = { version = "*", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "*"
embassy-sync = "*"
embedded-hal-async = "1.0.0"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
ads1x1x = "0.3.0"
nb = "1.1.0"
defmt = { version = "1.0.1", optional = true }
defmt-rtt = { version = "1.0.0", optional = true }
panic-probe = { version = "1.0.0", optional = true }
panic-reset = "0.1.1"

[build-dependencies]
built = { version = "0.7.7", features = ["git2"] }

[features]
default = ["debug"]
debug = ["defmt", "dep:panic-probe"]
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "can-utils/defmt",
    "dp-engine-control-board/derive_defmt",
    "dp-system-management/derive_defmt",
    "panic-probe/defmt",
    "panic-probe/defmt-error",
    "panic-probe/print-defmt",
    "embassy-executor/defmt",
    "embassy-sync/defmt",
    "embassy-futures/defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime",
    "embassy-stm32/defmt",
    "embedded-hal-async/defmt-03",
    "embedded-hal-bus/defmt-03",
    "embedded-utils/defmt",
    "max31889-thermistor/defmt-03",
    "ads1120-thermocouples/defmt",
    "analog-pressure/defmt",
]

[[bin]]
name = "fw-engine-board"
test = false
doctest = false
bench = false
