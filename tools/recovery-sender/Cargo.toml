[package]
name = "recovery-sender"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
data-core = { path = "../../data-definitions/core", features = ["can", "std"] }
datatypes = { path = "../../data-definitions/datatypes" }
dp-recovery-board = { path = "../../data-definitions/datapoints/dp-recovery-board", features = [
    "can",
    "std",
    "derive_debug",
] }
dp-system-management = { path = "../../data-definitions/datapoints/dp-system-management", features = [
    "can",
    "std",
    "derive_debug",
] }
embedded-can = "0.4.1"
crossterm = "0.29"

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = "3.5.0"
