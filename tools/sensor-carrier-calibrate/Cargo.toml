[package]
name = "sensor-carrier-calibrate"
version = "0.1.0"
edition = "2024"
description = "Fits sensor calibration and latencies from fw-sensor-carrier-v3 SD logs"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1.4"
levenberg-marquardt = "0.15"
nalgebra = "0.34"
nalgebra-sparse = "0.11"
plotters = { version = "0.3.7", default-features = false, features = [
    "svg_backend",
    "line_series",
    "point_series",
] }
serde = { version = "1", features = ["derive"] }
rand = "0.9"
rand_distr = "0.5"
magcal = { git = "https://github.com/Rechenmaschine/magcal-rs.git", rev = "f2fb205" }
