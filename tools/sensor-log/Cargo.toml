[package]
name = "sensor-log"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anstream = "0.6"
anstyle = "1"
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
clap = { version = "4", features = ["derive"] }
cobs = "0.3"
indicatif = "0.17"
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "snap"] }
postcard-schema = { version = "0.2", features = ["use-std"] }
serde_json = "1"
