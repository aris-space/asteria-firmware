[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "sef-light"
version = "0.1.0"
requires-python = ">=3.12"

# Rebuild the extension when the binding or the estimator changes.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../../crates/asteria-sef-light/src/**/*.rs" },
    { file = "../../crates/asteria-estimator-selector/src/**/*.rs" },
]
