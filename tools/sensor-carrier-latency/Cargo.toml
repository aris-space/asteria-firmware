[package]
name = "sensor-carrier-latency"
version = "0.1.0"
edition = "2024"
description = "Fits per-sensor latencies from fw-sensor-carrier-v3 SD logs"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1.4"
levenberg-marquardt = "0.15"
nalgebra = "0.34"
nalgebra-sparse = "0.11"
serde = { version = "1", features = ["derive"] }
