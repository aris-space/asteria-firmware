[package]
name = "fw-fuel-control-board"
version = "0.1.0"
edition = "2024"
authors = ["Domenic Nebiker <dnebiker@aris-space.ch>"]

[dependencies]
filters = { path = "../../crates/filters" }
datatypes = { path = "../../../asteria-data-definitions/datatypes", features = ["derive_defmt"] }
embedded-utils = { path = "../../crates/embedded-utils" }
hermes-can = { path = "../../hermes-can", version = "=0.3", features = [
    "defmt",
    "message-pressurization-line-pressure",
    "message-fuel-tank-pressure",
    "message-fuel-control-board-build-info",
    "message-fuel-control-board-status",
    "message-fuel-control-board-valve-states",
    "message-fuel-vent-control-fc",
    "message-fuel-dpr-config-fc",
    "message-pressure-vent-control-fc",
    "message-fuel-dpr-config-ecu",
    "message-fuel-vent-control-ecu",
    "message-pressure-vent-control-ecu",
    "message-fuel-dpr-config-rfs",
    "message-fuel-vent-control-rfs",
    "message-pressure-vent-control-rfs",
    "message-fuel-pressurization",
    "message-fuel-pressurization-abort",
    "message-fuel-pressurization-gain",
] }
thiserror = { version = "2.0.11", default-features = false }
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embassy-stm32 = { version = "*", features = [
    "stm32g473rc",
    "time-driver-any",
    "memory-x",
    "unstable-pac",
    "exti",
    "single-bank",
] }
embassy-time = { version = "*", features = ["tick-hz-32_768"] }
embassy-executor = { version = "*", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "*"
embassy-sync = "*"
embedded-can = "0.4.1"
embedded-hal-async = "1.0.0"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
defmt = { version = "1.0.1", optional = true }
defmt-rtt = { version = "1.0.0", optional = true }
panic-probe = { version = "1.0.0", optional = true }
panic-reset = "0.1.1"

[build-dependencies]
built = { version = "0.7.7", features = ["git2"] }

[features]
default = ["debug"]
debug = ["defmt", "dep:panic-probe"]
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "panic-probe/defmt",
    "panic-probe/defmt-error",
    "panic-probe/print-defmt",
    "embassy-executor/defmt",
    "embassy-sync/defmt",
    "embassy-futures/defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime",
    "embassy-stm32/defmt",
    "embedded-hal-async/defmt-03",
    "embedded-hal-bus/defmt-03",
]

[[bin]]
name = "fw-fuel-control-board"
test = false
doctest = false
bench = false
