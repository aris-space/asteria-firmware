[package]
name = "camera-board-validation"
version = "0.1.0"
edition = "2024"
authors = ["Louis Schell <louis.schell1@gmx.de>"]
license = "MIT OR Apache-2.0"

[dependencies]
# cortex-m setup
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"

# Embassy stuff
embassy-stm32 = { version = "*", features = [
    "stm32g4a1ke",
    "time-driver-any",
    "unstable-pac",
    "defmt",
    "memory-x",
] }
embassy-time = { version = "*", features = ["tick-hz-32_768", "defmt-timestamp-uptime-us"] }
embassy-executor = { version = "*", features = ["platform-cortex-m", "executor-thread"] }

assign-resources = "0.5.0"

defmt = { version = "1.0.1" }
defmt-rtt = "1"

panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[[bin]]
name = "camera-board-validation"
test = false
doctest = false
bench = false
