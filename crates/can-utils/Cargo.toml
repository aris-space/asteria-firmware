[package]
name = "can-utils"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
# STM32 code is checked on the embedded target; derive crates have host tests.
test = false
doctest = false
bench = false

[dependencies]
embassy-stm32.workspace = true
embassy-sync.workspace = true
embassy-executor.workspace = true
embassy-time.workspace = true
embedded-can = "0.4.1"
embedded-utils = { path = "../embedded-utils" }
can-hal = { path = "../../data-definitions/can-hal" }
collector-derive = { path = "./macros/collector" }
broadcast-derive = { path = "./macros/broadcast" }
thiserror = { version = "2.0.18", default-features = false }
defmt = { workspace = true, optional = true }

[features]
defmt = [
    "dep:defmt",
    "embassy-stm32/defmt",
    "can-hal/defmt",
    "embedded-utils/defmt",
    "embassy-time/defmt",
]
