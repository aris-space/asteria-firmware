# Shared library crates used across all fw-* board workspaces:
# embedded-utils, wire-types, filters, and device drivers.
# See also: ../shared/ for raw source snippets included via include!().
[workspace]
resolver = "2"
members = [
    "embedded-utils",
    "wire-types",
    "filters",
    "can-utils",
    "devices/ads1120-thermocouples",
    "devices/ms5607",
    "devices/lsm6dso32",
    "devices/epos4",
    "devices/keller-pressure",
    "devices/trafag-pressure",
    "devices/max31889-thermistor",
    "devices/ltc2945",
]

[workspace.dependencies]
cortex-m = "0.7.7"
embassy-stm32 = "*"
embassy-time = { version = "*", features = ["tick-hz-32_768"] }
embassy-sync = "*"
embassy-executor = "*"
embassy-embedded-hal = "*"
embedded-hal-async = "1.0.0"
embedded-hal-bus = "0.3.0"
defmt = { version = "1.0.1" }

[patch.crates-io]
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy.git", rev = "cf6a6cd" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "cf6a6cd" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "cf6a6cd" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "cf6a6cd" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy.git", rev = "cf6a6cd" }
