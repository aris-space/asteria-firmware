[package]
name = "ina232"
version = "0.1.0"
edition = "2024"
authors = ["Robert Jahnke", "Louis Schell"]
description = "Device driver for the INA232 Current/Voltage/Power Monitor"

[dependencies]
device-driver = "1.0.4"
embedded-hal-async = "1.0.0"
embedded-hal = "1.0.0"

defmt = { version = "1.0.1", optional = true }

[features]
default = ["defmt-03"]
defmt-03 = ["device-driver/defmt-03", "defmt"]

[lib]
test = false
doctest = false
bench = false
