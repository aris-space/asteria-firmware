name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# If new code is pushed to a PR branch, then cancel in progress workflows for that PR. Ensures that
# we don't waste CI time, and returns results quicker https://github.com/jonhoo/rust-ci-conf/pull/5
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2026-02-03

jobs:
  test:
    runs-on: self-hosted
    name: ⚙️ test (host std)
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ASTERIA_CI_TOKEN }}
          submodules: true
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install just
        uses: extractions/setup-just@v1
      - uses: Swatinem/rust-cache@v2 # Cache Rust build artifacts
      - name: just test
        run: just test

  fmt:
    runs-on: self-hosted
    name: 🖋️ fmt
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ASTERIA_CI_TOKEN }}
          submodules: true
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Install just
        uses: extractions/setup-just@v1
      - name: cargo fmt --check
        # Check code formatting using rustfmt.
        run: just fmt --check

  clippy:
    runs-on: self-hosted
    name: 📋 clippy (embedded thumbv7em)
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ASTERIA_CI_TOKEN }}
          submodules: true
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          targets: thumbv7em-none-eabihf
      - name: Install just
        uses: extractions/setup-just@v1
      - uses: Swatinem/rust-cache@v2 # Cache Rust build artifacts
      - name: just ci-checks
        run: just ci-checks

  doc:
    # run docs generation on nightly rather than stable. This enables features like
    # https://doc.rust-lang.org/beta/unstable-book/language-features/doc-cfg.html which allows an
    # API be documented as only available in some specific platforms.
    runs-on: self-hosted
    name: 📖 doc
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ASTERIA_CI_TOKEN }}
          submodules: true
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install just
        uses: extractions/setup-just@v1
      - uses: Swatinem/rust-cache@v2 # Cache Rust build artifacts
      - name: Build docs
        # Not quite sure anymore about these flags. But --workspace is important.
        run: just doc
        env:
          RUSTDOCFLAGS: -Zunstable-options --cfg docsrs -D warnings
