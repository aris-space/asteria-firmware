name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# If new code is pushed to a PR branch, then cancel in progress workflows for that PR. Ensures that
# we don't waste CI time, and returns results quicker https://github.com/jonhoo/rust-ci-conf/pull/5
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2025-08-04

jobs:
  test:
    runs-on: self-hosted
    name: ⚙️ test (host std)
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.HERMES_CI_TOKEN }}
          submodules: true
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: cargo generate-lockfile
        # enable this ci template to run regardless of whether the lockfile is checked in or not
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2 # Cache Rust build artifacts
      - name: cargo test --locked
        # Not using `--all-targets`, to get doctests everywhere.
        run: cargo test --locked --workspace --all-features -- --skip skipci

  fmt:
    runs-on: self-hosted
    name: 🖋️ fmt
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.HERMES_CI_TOKEN }}
          submodules: true
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: cargo fmt --check
        # Check code formatting using rustfmt.
        run: cargo fmt --check

  clippy:
    runs-on: self-hosted
    name: 📋 clippy (embedded thumbv7em)
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.HERMES_CI_TOKEN }}
          submodules: true
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          targets: thumbv7em-none-eabihf
      - name: Install cargo-hack
        run: cargo install cargo-hack --locked
      - uses: Swatinem/rust-cache@v2 # Cache Rust build artifacts
      - name: cargo hack clippy (all feature-sets, embedded)
        run: cargo hack clippy --workspace --feature-powerset --target thumbv7em-none-eabihf -- -D warnings

  doc:
    # run docs generation on nightly rather than stable. This enables features like
    # https://doc.rust-lang.org/beta/unstable-book/language-features/doc-cfg.html which allows an
    # API be documented as only available in some specific platforms.
    runs-on: self-hosted
    name: 📖 doc
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.HERMES_CI_TOKEN }}
          submodules: true
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2 # Cache Rust build artifacts
      - name: Install cargo-hack
        run: cargo install cargo-hack --locked
      - name: Build docs
        # Not quite sure anymore about these flags. But --workspace is important.
        run: >
          cargo hack doc --no-deps --all-features --workspace 
          --document-private-items -Zrustdoc-map --target thumbv7em-none-eabihf
        env:
          RUSTDOCFLAGS: -Zunstable-options --cfg docsrs -D warnings
